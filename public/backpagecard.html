<html lang="vi">
<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Philosopher:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

  <style>
    @font-face {
      font-family: 'DFVNLeagueScript';
      src: url('/fonts/DFVNLeagueScript.otf') format('opentype');
    }
    @font-face {
      font-family: 'DFVNPencerio';
      src: url('/fonts/DFVNPencerio.ttf') format('truetype');
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #bdb3a8;
      font-family: 'Be Vietnam Pro', sans-serif;
      padding: 24px 16px 48px;
    }

    .controls { text-align: center; margin-bottom: 18px; }
    .controls p { font-size: 11px; color: #6b5d52; letter-spacing: 0.06em; margin-bottom: 10px; }
    .btn {
      background: #6B4F3B; color: #E8DDD0; border: none;
      padding: 9px 28px; font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
      cursor: pointer; border-radius: 2px;
    }
    .btn:hover { background: #5a4130; }

    /* ── Card: landscape 36 × 24 cm ── */
    .card {
      width: 36cm; height: 24cm;
      background: #faf8f4;
      margin: 0 auto;
      display: flex;
      flex-direction: row;
      position: relative;
      box-shadow: 0 12px 56px rgba(0,0,0,0.22);
      overflow: hidden;
      transform: rotate(180deg);
    }
    .card::before {
      content: ''; position: absolute; inset: 6mm;
      border: 0.7pt solid rgba(184,151,102,0.5);
      pointer-events: none; z-index: 20;
    }
    .card::after {
      content: ''; position: absolute; inset: 8.5mm;
      border: 0.3pt solid rgba(184,151,102,0.28);
      pointer-events: none; z-index: 20;
    }

    /* ── Sections — 14 | 14 | 8 (left → right) ── */
    .section { height: 100%; position: relative; overflow: hidden; flex-shrink: 0; }
    .sec-1 { width: 14cm; }
    .sec-2 { width: 14cm; }
    .sec-3 { width: 8cm;  }

    /* Vertical fold lines */
    .fold-line {
      width: 0; height: 100%;
      border-left: 1pt dashed rgba(184,151,102,0.55);
      position: relative; z-index: 15; flex-shrink: 0;
    }
    .fold-line::before, .fold-line::after {
      content: ''; position: absolute; left: 50%;
      transform: translateX(-50%); width: 0; height: 0;
    }
    .fold-line::before {
      top: 0;
      border-left: 3px solid transparent; border-right: 3px solid transparent;
      border-top: 5px solid rgba(184,151,102,0.5);
    }
    .fold-line::after {
      bottom: 0;
      border-left: 3px solid transparent; border-right: 3px solid transparent;
      border-bottom: 5px solid rgba(184,151,102,0.5);
    }

    /* ── Inner wrapper ── */
    .p-inner {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 8mm 12mm;
      position: relative; z-index: 2; text-align: center;
    }

    /* Text flip — words only rotate 180° */
    .words {
      transform: rotate(180deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    /* Corner SVG helpers */
    .corner-svg { position: absolute; z-index: 1; }
    .c-tl { top: 0; left: 0; }
    .c-tr { top: 0; right: 0; transform: scaleX(-1); }
    .c-bl { bottom: 0; left: 0; transform: scaleY(-1); }
    .c-br { bottom: 0; right: 0; transform: scale(-1); }

    @media print {
      body { background: white; padding: 0; }
      .controls { display: none; }
      .card { box-shadow: none; margin: 0; }
      @page { size: 36cm 24cm landscape; margin: 0; }
    }
  </style>
</head>
